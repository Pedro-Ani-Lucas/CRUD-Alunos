<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Alunos</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container py-5">
        <h2 class="text-center mb-4">CRUD de Alunos</h2>

        <!-- FORMULÁRIO -->
        <div class="card p-4 shadow-sm mb-4">
            <h4>Cadastrar Novo Aluno</h4>

            <form id="formAluno">
                <div class="row mt-3">
                    <div class="col-md-3">
                        <label class="form-label">Nome</label>
                        <input type="text" id="nome" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Turma</label>
                        <input type="text" id="turma" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Curso</label>
                        <input type="text" id="curso" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Matrícula</label>
                        <input type="text" id="matricula" class="form-control" required>
                    </div>
                </div>

                <button class="btn btn-primary mt-3" type="submit">Cadastrar</button>
            </form>
        </div>

        <!-- TABELA -->
        <div class="card p-4 shadow-sm">
            <h4>Lista de Alunos</h4>

            <table class="table table-striped mt-3">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Turma</th>
                        <th>Curso</th>
                        <th>Matrícula</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaAlunos"></tbody>
            </table>
        </div>
    </div>



    <!-- MODAL DE EDIÇÃO -->
    <div class="modal fade" id="modalEditar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Aluno</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form id="formEditar">

                        <input type="hidden" id="edit-id">

                        <label class="form-label">Nome</label>
                        <input type="text" id="edit-nome" class="form-control" required>

                        <label class="form-label mt-2">Turma</label>
                        <input type="text" id="edit-turma" class="form-control" required>

                        <label class="form-label mt-2">Curso</label>
                        <input type="text" id="edit-curso" class="form-control" required>

                        <label class="form-label mt-2">Matrícula</label>
                        <input type="text" id="edit-matricula" class="form-control" required>

                    </form>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" onclick="salvarEdicao()">Salvar</button>
                </div>

            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
